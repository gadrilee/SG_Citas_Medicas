# Blueprint de Render: servicio web gratuito con Docker.
# La base de datos se crea aparte (Neon recomendado) y su URL se carga en DATABASE_URL.
services:
  - type: web
    name: vida-salud
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: produccion
      - key: APP_DEBUG
        value: "0"
      # Firma las respuestas de la pasarela simulada (Render genera un valor aleatorio).
      - key: APP_KEY
        generateValue: true
      # simulada | stripe
      - key: PASARELA
        value: simulada
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Solo si PASARELA=stripe (claves de modo prueba del panel de Stripe).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
