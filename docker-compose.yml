# Entorno local: PostgreSQL + aplicación + compilación de estilos en vivo.
#   docker compose up --build        → http://localhost:8080
#   docker compose down -v           → borra la base (se recrea con 001–004 al volver a subir)
services:
  bd:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vida_salud
      POSTGRES_USER: vida_salud
      POSTGRES_PASSWORD: vida_salud
      TZ: America/La_Paz
    ports:
      - "5433:5432"
    volumes:
      - datos_bd:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético solo la primera vez (volumen vacío).
      - ./bd/clinica_vida_salud.sql:/docker-entrypoint-initdb.d/001_esquema.sql:ro
      - ./bd/migraciones/002_restricciones.sql:/docker-entrypoint-initdb.d/002_restricciones.sql:ro
      - ./bd/migraciones/003_catalogos.sql:/docker-entrypoint-initdb.d/003_catalogos.sql:ro
      - ./bd/semillas/004_datos_demo.sql:/docker-entrypoint-initdb.d/004_datos_demo.sql:ro
      - ./bd/migraciones/005_tarifa_especialidad.sql:/docker-entrypoint-initdb.d/005_tarifa_especialidad.sql:ro
      - ./bd/semillas/006_datos_demo_p3.sql:/docker-entrypoint-initdb.d/006_datos_demo_p3.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vida_salud -d vida_salud"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      APP_ENV: local
      APP_DEBUG: "1"
      APP_URL: http://localhost:8080
      DATABASE_URL: postgres://vida_salud:vida_salud@bd:5432/vida_salud
      PORT: 8080
    ports:
      # Si el 8080 está ocupado: PUERTO_APP=8090 docker compose up
      - "${PUERTO_APP:-8080}:8080"
    volumes:
      # El código se monta para ver los cambios sin reconstruir la imagen.
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./publico:/var/www/html/publico
    depends_on:
      bd:
        condition: service_healthy

  estilos:
    build:
      context: .
      target: estilos
    command: tailwindcss -c tailwind.config.js -i recursos/css/app.css -o publico/css/app.css --watch --poll
    tty: true
    volumes:
      - ./tailwind.config.js:/src/tailwind.config.js:ro
      - ./recursos:/src/recursos:ro
      - ./app:/src/app:ro
      - ./publico:/src/publico

volumes:
  datos_bd:
