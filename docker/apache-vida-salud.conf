# Sitio único: solo la carpeta publico/ es accesible desde la web; el resto del código queda fuera.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/publico
    <Directory /var/www/html/publico>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Todo lo que no sea un archivo existente (css, js, img) lo atiende index.php.
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
